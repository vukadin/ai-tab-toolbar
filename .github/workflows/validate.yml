name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r scripts/requirements.txt
      - run: npm run check
      - run: npm run check:icons
      - run: npm run check:listing-icon
      - run: npm run package:draft
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ai-tab-toolbar-inspection-package
          path: dist/*.vsix
          if-no-files-found: error
